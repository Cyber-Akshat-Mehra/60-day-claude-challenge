<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Compass — Tech Company</title>
<style>
:root{
  --bg-0:#0a0e17;
  --bg-1:#0f1420;
  --panel:rgba(255,255,255,0.045);
  --panel-b:rgba(255,255,255,0.09);
  --ink:#e8ecf6;
  --ink-dim:#8891a7;
  --accent-fe:#5ec8f0;   /* frontend - sky */
  --accent-be:#7c8bf5;   /* backend - indigo */
  --accent-qa:#f0b95e;   /* qa - amber */
  --accent-pm:#f0708c;   /* product - rose */
  --accent-ux:#c47cf5;   /* design - violet */
  --accent-cs:#5ef0a8;   /* support - mint */
  --accent-em:#f0d95e;   /* eng manager - gold */
  --accent-sec:#f05e5e;  /* security - red */
  --good:#5ef0a8;
  --font-display:'Iosevka Compass', 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
  --font-body:'Inter', 'Segoe UI', system-ui, sans-serif;
  --font-mono:'JetBrains Mono', 'Consolas', monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(94,200,240,0.10), transparent 60%),
    radial-gradient(ellipse 900px 600px at 90% 10%, rgba(124,139,245,0.10), transparent 60%),
    linear-gradient(180deg, var(--bg-0), var(--bg-1));
  color:var(--ink);
  font-family:var(--font-body);
  min-height:100vh;
  padding:24px 16px 60px;
  overflow-x:hidden;
}
.wrap{max-width:980px; margin:0 auto;}

/* ---------- HEADER ---------- */
header.app-head{text-align:center; margin-bottom:28px;}
.compass-mark{
  width:56px; height:56px; margin:0 auto 14px;
  border-radius:50%;
  background:conic-gradient(from 0deg, var(--accent-fe), var(--accent-be), var(--accent-pm), var(--accent-qa), var(--accent-fe));
  display:flex; align-items:center; justify-content:center;
  animation:spin 12s linear infinite;
  box-shadow:0 0 40px rgba(94,200,240,0.25);
}
.compass-mark::after{
  content:"◆"; font-size:18px; color:var(--bg-0); animation:spin 12s linear infinite reverse;
}
@keyframes spin{to{transform:rotate(360deg)}}
h1.title{
  font-family:var(--font-display);
  font-size:clamp(28px,5vw,42px);
  letter-spacing:-0.02em;
  background:linear-gradient(90deg,#e8ecf6,#a9c4f5 40%,#c9a9f5 70%,#e8ecf6);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  background-size:200% auto;
  animation:shine 6s linear infinite;
}
@keyframes shine{to{background-position:200% center;}}
p.subtitle{color:var(--ink-dim); margin-top:6px; font-size:15px; letter-spacing:0.02em;}

/* ---------- PROGRESS ---------- */
.progress-rail{
  display:flex; gap:8px; justify-content:center; margin:22px 0 8px; flex-wrap:wrap;
}
.stage-pill{
  padding:7px 14px; border-radius:999px; font-size:12.5px; font-weight:600;
  border:1px solid var(--panel-b); background:var(--panel); color:var(--ink-dim);
  letter-spacing:0.03em; transition:all .35s ease;
}
.stage-pill.active{color:var(--bg-0); background:linear-gradient(90deg,var(--accent-fe),var(--accent-be)); border-color:transparent; box-shadow:0 4px 20px rgba(94,200,240,0.3);}
.stage-pill.done{color:var(--good); border-color:rgba(94,240,168,0.4);}
.dots{display:flex; gap:6px; justify-content:center; margin-bottom:20px;}
.dots span{width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,0.14); transition:all .3s;}
.dots span.on{background:var(--accent-fe); box-shadow:0 0 8px var(--accent-fe);}

/* ---------- CARD SHELL ---------- */
.stage-card{
  background:var(--panel);
  border:1px solid var(--panel-b);
  border-radius:22px;
  padding:clamp(18px,4vw,34px);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  position:relative;
  overflow:hidden;
  animation:fadeUp .5s ease;
}
.stage-card::before{
  content:""; position:absolute; inset:0; pointer-events:none; opacity:0.5;
  background:radial-gradient(600px 200px at 50% -20%, rgba(124,139,245,0.15), transparent 70%);
}
@keyframes fadeUp{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:translateY(0)}}

.eyebrow{font-family:var(--font-mono); font-size:11.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--accent-fe); margin-bottom:8px;}
.stage-heading{font-family:var(--font-display); font-size:clamp(20px,3vw,26px); margin-bottom:6px;}
.stage-desc{color:var(--ink-dim); font-size:14.5px; margin-bottom:22px; max-width:60ch;}

/* ---------- TICKET (task card) ---------- */
.ticket{
  background:linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
  border:1px dashed rgba(255,255,255,0.18);
  border-radius:16px;
  padding:18px 20px;
  margin-bottom:24px;
  position:relative;
}
.ticket::before{
  content:"TICKET"; position:absolute; top:-9px; left:16px; background:var(--bg-1);
  padding:0 8px; font-family:var(--font-mono); font-size:10px; letter-spacing:0.1em; color:var(--ink-dim);
}
.ticket-id{font-family:var(--font-mono); font-size:11px; color:var(--ink-dim); margin-bottom:8px;}
.ticket-text{font-size:16.5px; line-height:1.5;}

/* ---------- ROLE CARDS / GRID ---------- */
.role-grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:12px; margin-bottom:10px;
}
.role-card{
  --c:var(--accent-fe);
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.1);
  border-left:3px solid var(--c);
  border-radius:12px;
  padding:14px 12px;
  cursor:grab;
  user-select:none;
  transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
  text-align:center;
}
.role-card:hover{transform:translateY(-3px); background:rgba(255,255,255,0.07); box-shadow:0 8px 24px rgba(0,0,0,0.35);}
.role-card:active{cursor:grabbing;}
.role-card.dragging{opacity:0.35;}
.role-card .emoji{font-size:24px; display:block; margin-bottom:6px;}
.role-card .rname{font-size:12.5px; font-weight:600;}
.role-card.placed{opacity:0.3; pointer-events:none;}

/* drop slot */
.drop-slot{
  min-height:78px;
  border:2px dashed rgba(255,255,255,0.22);
  border-radius:14px;
  display:flex; align-items:center; justify-content:center;
  color:var(--ink-dim); font-size:13px;
  margin-bottom:18px;
  transition:all .2s ease;
}
.drop-slot.over{border-color:var(--accent-fe); background:rgba(94,200,240,0.08); box-shadow:0 0 0 3px rgba(94,200,240,0.08) inset;}
.drop-slot.filled{border-style:solid; border-color:var(--good); background:rgba(94,240,168,0.06);}
.drop-slot .placed-card{padding:10px 18px; border-radius:10px; background:rgba(255,255,255,0.06); font-weight:600; display:flex; gap:8px; align-items:center;}

/* stage 2 sequence lane */
.lane-label{font-family:var(--font-mono); font-size:11px; color:var(--ink-dim); margin-bottom:8px; letter-spacing:.08em;}
.sequence-lane{
  display:flex; flex-wrap:wrap; gap:10px; align-items:center;
  min-height:70px; padding:12px; border-radius:14px;
  border:2px dashed rgba(255,255,255,0.2); margin-bottom:20px;
}
.sequence-lane.over{border-color:var(--accent-be); background:rgba(124,139,245,0.08);}
.seq-slot{
  width:126px; min-height:58px; border-radius:10px; border:1.5px dashed rgba(255,255,255,0.25);
  display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-dim);
  position:relative;
}
.seq-slot .arrow{position:absolute; right:-16px; font-size:16px; color:var(--ink-dim);}
.seq-slot:last-child .arrow{display:none;}
.seq-slot.filled{border-style:solid; border-color:var(--accent-be); background:rgba(124,139,245,0.1); color:var(--ink);}

/* stage 3 multi-select */
.multi-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin-bottom:18px;}
.role-card.multi.selected{border-color:var(--good); box-shadow:0 0 0 2px rgba(94,240,168,0.3) inset; background:rgba(94,240,168,0.08);}
.multi-count{font-size:13px; color:var(--ink-dim); margin-bottom:14px;}

/* ---------- BUTTONS ---------- */
.btn-row{display:flex; gap:12px; margin-top:18px; flex-wrap:wrap;}
button.primary{
  background:linear-gradient(90deg,var(--accent-fe),var(--accent-be));
  color:#0a0e17; font-weight:700; border:none; padding:13px 26px; border-radius:12px;
  font-size:14.5px; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease;
  box-shadow:0 6px 24px rgba(94,200,240,0.25);
}
button.primary:hover{transform:translateY(-2px); box-shadow:0 10px 30px rgba(94,200,240,0.35);}
button.primary:disabled{opacity:0.35; cursor:not-allowed; transform:none; box-shadow:none;}
button.ghost{
  background:transparent; border:1px solid var(--panel-b); color:var(--ink);
  padding:13px 22px; border-radius:12px; font-size:14.5px; cursor:pointer; transition:all .15s ease;
}
button.ghost:hover{background:rgba(255,255,255,0.06);}

/* ---------- REVEAL PANEL ---------- */
.reveal{
  margin-top:22px; padding:18px 20px; border-radius:16px;
  background:rgba(94,240,168,0.06); border:1px solid rgba(94,240,168,0.25);
  animation:fadeUp .4s ease;
}
.reveal h4{font-size:14px; margin-bottom:6px; color:var(--good); display:flex; gap:8px; align-items:center;}
.reveal p{font-size:14px; color:var(--ink); line-height:1.6; margin-bottom:10px;}
.reveal .assist-tags{display:flex; gap:6px; flex-wrap:wrap;}
.assist-tag{font-size:11.5px; padding:4px 10px; border-radius:999px; background:rgba(255,255,255,0.07); border:1px solid var(--panel-b); color:var(--ink-dim);}

/* flow animation ticket */
.flow-stage{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:18px 0;}
.flow-node{
  padding:9px 14px; border-radius:10px; background:rgba(255,255,255,0.05); border:1px solid var(--panel-b);
  font-size:12.5px; opacity:0.25; transform:scale(0.9); transition:all .4s ease;
}
.flow-node.lit{opacity:1; transform:scale(1); box-shadow:0 0 16px rgba(124,139,245,0.35); border-color:var(--accent-be);}
.flow-arrow{color:var(--ink-dim); font-size:14px;}

/* ---------- SCORE / RESULTS ---------- */
.score-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin:22px 0;}
@media (max-width:640px){.score-grid{grid-template-columns:1fr;}}
.bar-row{margin-bottom:16px;}
.bar-row .lbl{display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; color:var(--ink-dim);}
.bar-track{height:10px; border-radius:999px; background:rgba(255,255,255,0.06); overflow:hidden;}
.bar-fill{height:100%; border-radius:999px; width:0%; transition:width 1.1s cubic-bezier(.2,.9,.3,1);}

canvas#radar{max-width:100%;}

.reflect-block{margin-top:8px; padding:16px 18px; border-radius:14px; background:rgba(255,255,255,0.035); border:1px solid var(--panel-b); margin-bottom:12px;}
.reflect-block h5{font-size:13px; color:var(--accent-ux); margin-bottom:6px; letter-spacing:.02em;}
.reflect-block p{font-size:14px; color:var(--ink-dim); line-height:1.55;}
.insight-box{
  margin-top:18px; padding:18px 20px; border-radius:16px;
  background:linear-gradient(120deg, rgba(124,139,245,0.12), rgba(196,124,245,0.1));
  border:1px solid rgba(196,124,245,0.3); font-style:italic; font-size:15px; line-height:1.6;
}

.celebrate{position:fixed; inset:0; pointer-events:none; z-index:50; overflow:hidden;}
.confetti{position:absolute; top:-20px; width:9px; height:14px; opacity:0.9; animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg); opacity:0;}}

.hidden{display:none !important;}
footer.credit{text-align:center; margin-top:30px; color:var(--ink-dim); font-size:12px; letter-spacing:.03em;}
</style>
</head>
<body>
<div class="wrap">

  <header class="app-head">
    <div class="compass-mark"></div>
    <h1 class="title">Task Compass</h1>
    <p class="subtitle">Learn how work flows through real organizations.</p>
  </header>

  <div class="progress-rail">
    <div class="stage-pill" id="pill-1">1 · Who Owns This?</div>
    <div class="stage-pill" id="pill-2">2 · Task Routing</div>
    <div class="stage-pill" id="pill-3">3 · Collaboration</div>
    <div class="stage-pill" id="pill-4">Results</div>
  </div>
  <div class="dots" id="dots"></div>

  <div id="app"></div>

  <footer class="credit">Task Compass · Tech Company edition · runs entirely offline</footer>
</div>

<script>
/* =========================================================
   DATA
========================================================= */
const ROLES = [
  {id:'fe', name:'Frontend Developer', emoji:'🖥️', color:'var(--accent-fe)'},
  {id:'be', name:'Backend Developer', emoji:'🗄️', color:'var(--accent-be)'},
  {id:'qa', name:'QA Engineer', emoji:'🧪', color:'var(--accent-qa)'},
  {id:'pm', name:'Product Manager', emoji:'📋', color:'var(--accent-pm)'},
  {id:'ux', name:'UX Designer', emoji:'🎨', color:'var(--accent-ux)'},
  {id:'cs', name:'Customer Support', emoji:'💬', color:'var(--accent-cs)'},
  {id:'em', name:'Engineering Manager', emoji:'🧭', color:'var(--accent-em)'},
  {id:'sec', name:'Security Engineer', emoji:'🔒', color:'var(--accent-sec)'}
];
const roleById = id => ROLES.find(r=>r.id===id);

// STAGE 1 — Ownership tasks (need 3, pull from pool of 8-10)
const OWNERSHIP_TASKS = [
  {id:'o1', text:'A customer reports that payments fail only on iPhones.', owner:'fe',
   why:'The failure is isolated to a specific client platform (iOS Safari/WebKit rendering or JS behavior), which points to how the frontend handles the payment flow on that device — not the payment logic itself.',
   assist:['qa','be']},
  {id:'o2', text:'The production database is returning slow query results during peak hours.', owner:'be',
   why:'Query performance, indexing, and database load are backend infrastructure concerns — the backend team controls the data layer and can diagnose and tune it.',
   assist:['em']},
  {id:'o3', text:'Users say the sign-up flow feels confusing and drop off before finishing.', owner:'ux',
   why:'This is a flow and comprehension problem, not a bug — it needs someone who designs the interaction and can test alternate layouts with users.',
   assist:['pm','fe']},
  {id:'o4', text:'A new feature was released and now certain edge cases crash the app.', owner:'qa',
   why:'QA owns verifying releases before and after launch; they are best positioned to reproduce, isolate, and document the crash conditions for a fix.',
   assist:['fe','be']},
  {id:'o5', text:'Leadership wants to know if the team should build a new dashboard or fix existing bugs first.', owner:'pm',
   why:'Prioritization across competing initiatives is a product management responsibility — balancing business value, user needs, and team capacity.',
   assist:['em']},
  {id:'o6', text:'A customer is angry that their support ticket has been open for two weeks with no update.', owner:'cs',
   why:'Customer Support owns the relationship and communication with the customer, even if the underlying fix depends on engineering.',
   assist:['em','be']},
  {id:'o7', text:'An engineer reports there is no clear process for who reviews pull requests before merging.', owner:'em',
   why:'Setting team process, standards, and workflow expectations is an engineering management responsibility.',
   assist:['be','fe']},
  {id:'o8', text:'A security researcher privately reports a vulnerability that exposes user emails.', owner:'sec',
   why:'Vulnerability triage, severity assessment, and coordinated disclosure are core security engineering responsibilities.',
   assist:['be','em']},
  {id:'o9', text:'A/B test results show a new button color increased clicks by 12%.', owner:'ux',
   why:'Interpreting a design experiment and deciding whether to roll it out sits with the person who owns the visual and interaction design.',
   assist:['pm','fe']},
  {id:'o10', text:'The API documentation is outdated and third-party developers keep integrating it incorrectly.', owner:'be',
   why:'The backend team owns the API contract and is closest to what actually changed, so they are responsible for keeping docs accurate.',
   assist:['pm']}
];

// STAGE 2 — Routing tasks (need 3)
const ROUTING_TASKS = [
  {id:'r1', text:'A customer reports a bug through the help widget.',
   correct:['cs','qa','be','fe','cs'],
   explain:'Support first confirms and logs what the customer experienced. QA reproduces it reliably. Backend or frontend fixes the root cause depending on where it lives. Support closes the loop with the customer so they know it is resolved.'},
  {id:'r2', text:'A designer proposes a redesigned checkout page.',
   correct:['ux','pm','fe','qa'],
   explain:'Design creates the proposal. Product validates it against business goals and scope. Frontend implements the new interface. QA verifies it works correctly before release.'},
  {id:'r3', text:'The team wants to ship a small backend performance fix.',
   correct:['be','qa','em'],
   explain:'Backend authors the fix since they own that code. QA verifies nothing breaks. The engineering manager gives the final go-ahead to deploy, since they own release risk.'},
  {id:'r4', text:'A new feature idea comes from a customer support ticket.',
   correct:['cs','pm','ux','be','qa'],
   explain:'Support surfaces the real need from the frontline. Product decides if and how to prioritize it. Design shapes the experience. Backend and QA build and validate it before release.'}
];

// STAGE 3 — Collaboration scenarios (need 3)
const COLLAB_TASKS = [
  {id:'c1', text:'Customer satisfaction suddenly drops after the last release.',
   primary:'pm',
   supporting:['cs','qa','em'],
   reasoning:'Product Manager owns diagnosing the "why" across the whole release. Support surfaces what users are actually complaining about. QA checks for regressions that shipped unnoticed. Engineering Management coordinates a fix if it is code-related.',
   flow:'Support logs complaints → Product investigates patterns → QA checks recent releases → Engineering Manager coordinates a fix.'},
  {id:'c2', text:'Sales increase dramatically after a marketing campaign.',
   primary:'em',
   supporting:['be','pm','qa'],
   reasoning:'Engineering Management owns making sure infrastructure can handle new load. Backend scales the systems under strain. Product tracks whether the new users are engaging well. QA stress-tests critical paths.',
   flow:'Engineering Manager assesses capacity risk → Backend scales infrastructure → QA verifies stability under load → Product monitors new-user engagement.'},
  {id:'c3', text:'Negative reviews appear online about the app\'s reliability.',
   primary:'cs',
   supporting:['qa','pm','em'],
   reasoning:'Support owns public-facing reputation and responding to reviewers directly. QA investigates the reliability issues raised. Product decides what to prioritize fixing. Engineering Management ensures the team has room to act.',
   flow:'Support responds publicly and gathers detail → QA investigates root causes → Product prioritizes fixes → Engineering Manager allocates team time.'},
  {id:'c4', text:'A major feature is delayed close to its announced launch date.',
   primary:'em',
   supporting:['pm','fe','be'],
   reasoning:'Engineering Management owns the delivery timeline and communicating risk upward. Product decides whether to cut scope or slip the date. Frontend and Backend report real technical status so decisions are grounded in reality.',
   flow:'Frontend & Backend report blockers → Engineering Manager assesses timeline risk → Product decides on scope or date changes → stakeholders are updated together.'}
];

/* =========================================================
   STATE
========================================================= */
let state = {
  stage:1,
  s1Index:0, s1Tasks: shuffle(OWNERSHIP_TASKS).slice(0,3),
  s2Index:0, s2Tasks: shuffle(ROUTING_TASKS).slice(0,3),
  s3Index:0, s3Tasks: shuffle(COLLAB_TASKS).slice(0,3),
  scores:{ownership:0, delegation:0, collaboration:0, workflow:0},
  scoreMax:{ownership:0, delegation:0, collaboration:0, workflow:0},
  log:{overAssign:0, underCollab:0, correctFirstTry:0}
};

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];}
  return a;
}

/* =========================================================
   RENDER ROUTER
========================================================= */
const app = document.getElementById('app');

function updateProgress(){
  const pills = ['pill-1','pill-2','pill-3','pill-4'];
  pills.forEach((id,i)=>{
    const el = document.getElementById(id);
    el.classList.remove('active','done');
    if(state.stage > i+1) el.classList.add('done');
    else if(state.stage === i+1) el.classList.add('active');
  });
  // dots for current sub-stage
  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML='';
  if(state.stage<=3){
    const total = 3;
    const idx = state.stage===1?state.s1Index:state.stage===2?state.s2Index:state.s3Index;
    for(let i=0;i<total;i++){
      const d=document.createElement('span');
      if(i<idx) d.classList.add('on');
      dotsEl.appendChild(d);
    }
  }
}

function render(){
  updateProgress();
  if(state.stage===1) renderStage1();
  else if(state.stage===2) renderStage2();
  else if(state.stage===3) renderStage3();
  else renderResults();
}

/* =========================================================
   STAGE 1 — WHO OWNS THIS?
========================================================= */
function renderStage1(){
  const task = state.s1Tasks[state.s1Index];
  const pool = shuffle(ROLES).slice(0, 7); // 7 role choices, ensure correct included
  if(!pool.find(r=>r.id===task.owner)) pool[0] = roleById(task.owner);
  const shuffledPool = shuffle(pool);

  app.innerHTML = `
    <div class="stage-card">
      <div class="eyebrow">Stage 1 · Ownership</div>
      <h2 class="stage-heading">Who Owns This?</h2>
      <p class="stage-desc">Drag the role that should take primary ownership into the slot below.</p>

      <div class="ticket">
        <div class="ticket-id">TASK-${task.id.toUpperCase()} · Incoming</div>
        <div class="ticket-text">${task.text}</div>
      </div>

      <div class="drop-slot" id="ownSlot" data-filled="0">Drop the primary owner here</div>

      <div class="role-grid" id="rolePool"></div>

      <div id="revealArea"></div>

      <div class="btn-row">
        <button class="primary" id="nextBtn" disabled>Continue →</button>
      </div>
    </div>
  `;

  const pool_el = document.getElementById('rolePool');
  shuffledPool.forEach(r=>{
    const card = document.createElement('div');
    card.className='role-card';
    card.style.setProperty('--c', r.color);
    card.draggable = true;
    card.dataset.roleId = r.id;
    card.innerHTML = `<span class="emoji">${r.emoji}</span><span class="rname">${r.name}</span>`;
    card.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', r.id); card.classList.add('dragging'); });
    card.addEventListener('dragend', ()=> card.classList.remove('dragging'));
    // touch/click fallback
    card.addEventListener('click', ()=> tryPlaceOwner(r.id, card));
    pool_el.appendChild(card);
  });

  const slot = document.getElementById('ownSlot');
  slot.addEventListener('dragover', e=>{ e.preventDefault(); slot.classList.add('over'); });
  slot.addEventListener('dragleave', ()=> slot.classList.remove('over'));
  slot.addEventListener('drop', e=>{
    e.preventDefault(); slot.classList.remove('over');
    const roleId = e.dataTransfer.getData('text/plain');
    const cardEl = pool_el.querySelector(`[data-role-id="${roleId}"]`);
    tryPlaceOwner(roleId, cardEl);
  });

  let answered = false;
  function tryPlaceOwner(roleId, cardEl){
    if(answered) return;
    answered = true;
    const role = roleById(roleId);
    slot.innerHTML = `<div class="placed-card"><span>${role.emoji}</span> ${role.name}</div>`;
    slot.classList.add('filled');
    if(cardEl) cardEl.classList.add('placed');

    const correct = roleId === task.owner;
    state.scoreMax.ownership += 1;
    if(correct){ state.scores.ownership += 1; state.log.correctFirstTry+=1; }
    else state.log.overAssign += 0; // wrong owner picks tracked implicitly

    const ownerRole = roleById(task.owner);
    const assistNames = task.assist.map(id=>roleById(id));
    document.getElementById('revealArea').innerHTML = `
      <div class="reveal">
        <h4>${correct ? '✓ Matches the primary owner' : '↻ A different primary owner fits best here'}</h4>
        <p><strong>${ownerRole.emoji} ${ownerRole.name}</strong> holds primary ownership of this task.</p>
        <p>${task.why}</p>
        <div class="assist-tags">
          ${assistNames.map(a=>`<span class="assist-tag">${a.emoji} ${a.name} may assist</span>`).join('')}
        </div>
      </div>
    `;
    document.getElementById('nextBtn').disabled = false;
  }

  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if(state.s1Index < state.s1Tasks.length - 1){
      state.s1Index++;
    } else {
      state.stage = 2;
    }
    render();
  });
}

/* =========================================================
   STAGE 2 — TASK ROUTING
========================================================= */
function renderStage2(){
  const task = state.s2Tasks[state.s2Index];
  const steps = task.correct.length;
  // build pool: correct roles (deduped) + a couple distractors
  let poolIds = [...new Set(task.correct)];
  const distractorCandidates = ROLES.map(r=>r.id).filter(id=>!poolIds.includes(id));
  poolIds = poolIds.concat(shuffle(distractorCandidates).slice(0,2));
  const pool = shuffle(poolIds.map(roleById));

  app.innerHTML = `
    <div class="stage-card">
      <div class="eyebrow">Stage 2 · Routing</div>
      <h2 class="stage-heading">Task Routing</h2>
      <p class="stage-desc">Build the workflow: drag roles into order, left to right, showing how this task should move through the org.</p>

      <div class="ticket">
        <div class="ticket-id">TASK-${task.id.toUpperCase()} · Incoming</div>
        <div class="ticket-text">${task.text}</div>
      </div>

      <div class="lane-label">Workflow (${steps} steps) — drag roles in order</div>
      <div class="sequence-lane" id="lane"></div>

      <div class="role-grid" id="rolePool2"></div>

      <div id="revealArea2"></div>

      <div class="btn-row">
        <button class="ghost" id="checkBtn">Check Workflow</button>
        <button class="primary" id="nextBtn2" disabled>Continue →</button>
      </div>
    </div>
  `;

  const lane = document.getElementById('lane');
  const slotEls = [];
  for(let i=0;i<steps;i++){
    const s = document.createElement('div');
    s.className='seq-slot';
    s.dataset.index = i;
    s.innerHTML = `Step ${i+1}<span class="arrow">→</span>`;
    slotEls.push(s);
    lane.appendChild(s);
  }
  const filled = new Array(steps).fill(null);

  const poolEl = document.getElementById('rolePool2');
  pool.forEach(r=>{
    const card = document.createElement('div');
    card.className='role-card';
    card.style.setProperty('--c', r.color);
    card.draggable = true;
    card.dataset.roleId = r.id;
    card.innerHTML = `<span class="emoji">${r.emoji}</span><span class="rname">${r.name}</span>`;
    card.addEventListener('dragstart', e=> e.dataTransfer.setData('text/plain', r.id));
    poolEl.appendChild(card);
  });

  slotEls.forEach(s=>{
    s.addEventListener('dragover', e=>{ e.preventDefault(); s.style.borderColor='var(--accent-be)'; });
    s.addEventListener('dragleave', ()=>{ if(!s.classList.contains('filled')) s.style.borderColor=''; });
    s.addEventListener('drop', e=>{
      e.preventDefault();
      const roleId = e.dataTransfer.getData('text/plain');
      placeInSlot(s, roleId);
    });
    s.addEventListener('click', ()=>{
      // click-fallback: place next available pool card selection handled via card click below
    });
  });

  poolEl.querySelectorAll('.role-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      const nextEmpty = slotEls.find(s=>!s.classList.contains('filled'));
      if(nextEmpty) placeInSlot(nextEmpty, card.dataset.roleId);
    });
  });

  function placeInSlot(slotEl, roleId){
    const role = roleById(roleId);
    const idx = Number(slotEl.dataset.index);
    filled[idx] = roleId;
    slotEl.classList.add('filled');
    slotEl.innerHTML = `${role.emoji} ${role.name}<span class="arrow">→</span>`;
    checkReady();
  }

  function checkReady(){
    document.getElementById('checkBtn').disabled = filled.some(f=>f===null);
  }
  document.getElementById('checkBtn').disabled = true;

  document.getElementById('checkBtn').addEventListener('click', ()=>{
    // animate flow
    let matchCount = 0;
    for(let i=0;i<steps;i++) if(filled[i]===task.correct[i]) matchCount++;
    const allMatch = matchCount === steps;

    state.scoreMax.workflow += steps;
    state.scores.workflow += matchCount;
    if(!allMatch) state.log.overAssign += 0;

    document.getElementById('revealArea2').innerHTML = `
      <div class="flow-stage" id="flowAnim">
        ${task.correct.map((id,i)=>{
          const r = roleById(id);
          return `<div class="flow-node" data-i="${i}">${r.emoji} ${r.name}</div>` + (i<steps-1?'<span class="flow-arrow">→</span>':'');
        }).join('')}
      </div>
      <div class="reveal">
        <h4>${allMatch ? '✓ This matches a common, effective routing' : '↻ Here is a routing that tends to work well'}</h4>
        <p>${task.explain}</p>
      </div>
    `;
    // animate lighting up nodes in sequence
    const nodes = document.querySelectorAll('#flowAnim .flow-node');
    nodes.forEach((n,i)=> setTimeout(()=> n.classList.add('lit'), i*350));

    document.getElementById('checkBtn').disabled = true;
    document.getElementById('nextBtn2').disabled = false;
  });

  document.getElementById('nextBtn2').addEventListener('click', ()=>{
    if(state.s2Index < state.s2Tasks.length - 1){
      state.s2Index++;
    } else {
      state.stage = 3;
    }
    render();
  });
}

/* =========================================================
   STAGE 3 — COLLABORATION CHALLENGE
========================================================= */
function renderStage3(){
  const task = state.s3Tasks[state.s3Index];
  const pool = shuffle(ROLES);

  app.innerHTML = `
    <div class="stage-card">
      <div class="eyebrow">Stage 3 · Collaboration</div>
      <h2 class="stage-heading">Collaboration Challenge</h2>
      <p class="stage-desc">This situation is bigger than one role. Select up to <strong>four</strong> roles who should be involved.</p>

      <div class="ticket">
        <div class="ticket-id">SITUATION-${task.id.toUpperCase()}</div>
        <div class="ticket-text">${task.text}</div>
      </div>

      <div class="multi-count" id="multiCount">Selected 0 / 4</div>
      <div class="multi-grid" id="multiPool"></div>

      <div id="revealArea3"></div>

      <div class="btn-row">
        <button class="ghost" id="submitBtn3">Submit Team</button>
        <button class="primary" id="nextBtn3" disabled>Continue →</button>
      </div>
    </div>
  `;

  const selected = new Set();
  const poolEl = document.getElementById('multiPool');
  pool.forEach(r=>{
    const card = document.createElement('div');
    card.className='role-card multi';
    card.style.setProperty('--c', r.color);
    card.dataset.roleId = r.id;
    card.innerHTML = `<span class="emoji">${r.emoji}</span><span class="rname">${r.name}</span>`;
    card.addEventListener('click', ()=>{
      if(selected.has(r.id)){
        selected.delete(r.id); card.classList.remove('selected');
      } else {
        if(selected.size >= 4) return;
        selected.add(r.id); card.classList.add('selected');
      }
      document.getElementById('multiCount').textContent = `Selected ${selected.size} / 4`;
      document.getElementById('submitBtn3').disabled = selected.size === 0;
    });
    poolEl.appendChild(card);
  });
  document.getElementById('submitBtn3').disabled = true;

  document.getElementById('submitBtn3').addEventListener('click', ()=>{
    const chosen = Array.from(selected);
    const hasPrimary = chosen.includes(task.primary);
    const supportOverlap = task.supporting.filter(id=>chosen.includes(id)).length;

    // scoring
    state.scoreMax.collaboration += 1;
    state.scoreMax.delegation += 1;
    if(hasPrimary) state.scores.delegation += 1;
    // collaboration score rewards covering supporting roles without over/under assigning wildly
    const collabScore = Math.min(1, supportOverlap / task.supporting.length);
    state.scores.collaboration += collabScore;

    if(chosen.length === 1) state.log.underCollab += 1;
    if(chosen.length >= 4 && supportOverlap < task.supporting.length) state.log.overAssign += 1;

    const primaryRole = roleById(task.primary);
    const supportRoles = task.supporting.map(roleById);

    document.getElementById('revealArea3').innerHTML = `
      <div class="reveal">
        <h4>${hasPrimary ? '✓ Primary owner included' : '↻ Consider this primary owner'}</h4>
        <p><strong>Primary owner:</strong> ${primaryRole.emoji} ${primaryRole.name}</p>
        <p><strong>Supporting teams:</strong></p>
        <div class="assist-tags" style="margin-bottom:10px;">
          ${supportRoles.map(r=>`<span class="assist-tag">${r.emoji} ${r.name}</span>`).join('')}
        </div>
        <p><strong>Reasoning:</strong> ${task.reasoning}</p>
        <p><strong>Communication flow:</strong> ${task.flow}</p>
      </div>
    `;
    document.getElementById('submitBtn3').disabled = true;
    document.getElementById('nextBtn3').disabled = false;
  });

  document.getElementById('nextBtn3').addEventListener('click', ()=>{
    if(state.s3Index < state.s3Tasks.length - 1){
      state.s3Index++;
    } else {
      state.stage = 4;
    }
    render();
  });
}

/* =========================================================
   RESULTS
========================================================= */
function pct(cat){
  const max = state.scoreMax[cat] || 1;
  return Math.round((state.scores[cat]/max)*100);
}

function renderResults(){
  const cats = [
    {key:'ownership', label:'Ownership', color:'var(--accent-fe)'},
    {key:'delegation', label:'Delegation', color:'var(--accent-pm)'},
    {key:'collaboration', label:'Collaboration', color:'var(--accent-cs)'},
    {key:'workflow', label:'Workflow Thinking', color:'var(--accent-be)'}
  ];

  app.innerHTML = `
    <div class="stage-card">
      <div class="eyebrow">Debrief</div>
      <h2 class="stage-heading">How You Think About Work</h2>
      <p class="stage-desc">Not a score — a picture of how you reason about ownership and collaboration.</p>

      <div class="score-grid">
        <div>
          ${cats.map(c=>`
            <div class="bar-row">
              <div class="lbl"><span>${c.label}</span><span>${pct(c.key)}%</span></div>
              <div class="bar-track"><div class="bar-fill" id="bar-${c.key}" style="background:${c.color}"></div></div>
            </div>
          `).join('')}
        </div>
        <div style="display:flex; align-items:center; justify-content:center;">
          <canvas id="radar" width="280" height="280"></canvas>
        </div>
      </div>

      <div class="reflect-block">
        <h5>What you understood well</h5>
        <p>${reflectStrength()}</p>
      </div>
      <div class="reflect-block">
        <h5>Where you tended to over-assign responsibility</h5>
        <p>${reflectOverAssign()}</p>
      </div>
      <div class="reflect-block">
        <h5>Where you underestimated collaboration</h5>
        <p>${reflectUnderCollab()}</p>
      </div>

      <div class="insight-box">${pickInsight()}</div>

      <div class="btn-row">
        <button class="primary" id="restartBtn">Explore Again</button>
      </div>
    </div>
  `;

  // animate bars
  requestAnimationFrame(()=>{
    cats.forEach(c=>{
      const el = document.getElementById(`bar-${c.key}`);
      if(el) el.style.width = pct(c.key)+'%';
    });
  });

  drawRadar(cats);
  celebrate();

  document.getElementById('restartBtn').addEventListener('click', ()=>{
    state = {
      stage:1,
      s1Index:0, s1Tasks: shuffle(OWNERSHIP_TASKS).slice(0,3),
      s2Index:0, s2Tasks: shuffle(ROUTING_TASKS).slice(0,3),
      s3Index:0, s3Tasks: shuffle(COLLAB_TASKS).slice(0,3),
      scores:{ownership:0, delegation:0, collaboration:0, workflow:0},
      scoreMax:{ownership:0, delegation:0, collaboration:0, workflow:0},
      log:{overAssign:0, underCollab:0, correctFirstTry:0}
    };
    render();
  });
}

function reflectStrength(){
  const cats = [['ownership','identifying who is closest to a problem'],['delegation','recognizing the right primary owner in complex situations'],
    ['collaboration','bringing in the right supporting roles'],['workflow','sequencing how work should move between people']];
  const sorted = cats.sort((a,b)=> pct(b[0]) - pct(a[0]));
  const top = sorted[0];
  return `You were strongest at ${top[1]}, correctly identifying the right role more often than not in that area. This tends to reflect a clear mental map of who does what on a team.`;
}
function reflectOverAssign(){
  if(state.log.overAssign > 1){
    return `In a few situations you assigned more roles than the situation needed. This is common — it often comes from wanting to be thorough — but pulling in too many people can slow decisions down as much as too few.`;
  }
  return `You generally kept ownership focused rather than spreading it across many roles unnecessarily. That said, it's worth double-checking that a "focused" call isn't accidentally leaving out someone essential.`;
}
function reflectUnderCollab(){
  if(state.log.underCollab >= 1){
    return `On at least one collaboration challenge, you assigned a single role to a situation that usually benefits from more than one perspective. Complex, cross-cutting problems rarely have just one owner.`;
  }
  return `You tended to recognize when a situation needed more than one team involved, rather than defaulting to a single owner for everything.`;
}
function pickInsight(){
  const insights = [
    "Many real workplace problems are solved by teams rather than individuals.",
    "Ownership isn't about doing all the work — it's about being accountable for the outcome.",
    "The best routing isn't always the fastest path; it's the one that catches problems early.",
    "Escalation isn't failure. It's often the fastest way to get the right resources on a problem.",
    "The people closest to a customer often see problems before anyone else does."
  ];
  return `"${insights[Math.floor(Math.random()*insights.length)]}"`;
}

function drawRadar(cats){
  const canvas = document.getElementById('radar');
  const ctx = canvas.getContext('2d');
  const cx = canvas.width/2, cy = canvas.height/2, R = 100;
  const n = cats.length;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // rings
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1;
  for(let ring=1; ring<=4; ring++){
    ctx.beginPath();
    for(let i=0;i<=n;i++){
      const ang = (Math.PI*2*i/n) - Math.PI/2;
      const r = R*ring/4;
      const x = cx + r*Math.cos(ang), y = cy + r*Math.sin(ang);
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  // axes + labels
  ctx.fillStyle = 'rgba(232,236,246,0.65)';
  ctx.font = '11px sans-serif';
  ctx.textAlign='center';
  for(let i=0;i<n;i++){
    const ang = (Math.PI*2*i/n) - Math.PI/2;
    const x = cx + R*Math.cos(ang), y = cy + R*Math.sin(ang);
    ctx.strokeStyle='rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x,y); ctx.stroke();
    const lx = cx + (R+22)*Math.cos(ang), ly = cy + (R+22)*Math.sin(ang);
    ctx.fillText(cats[i].label, lx, ly);
  }
  // data polygon
  ctx.beginPath();
  cats.forEach((c,i)=>{
    const ang = (Math.PI*2*i/n) - Math.PI/2;
    const val = pct(c.key)/100;
    const r = R*val;
    const x = cx + r*Math.cos(ang), y = cy + r*Math.sin(ang);
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.closePath();
  ctx.fillStyle='rgba(94,200,240,0.22)';
  ctx.strokeStyle='#5ec8f0';
  ctx.lineWidth=2;
  ctx.fill();
  ctx.stroke();
}

function celebrate(){
  const layer = document.createElement('div');
  layer.className='celebrate';
  document.body.appendChild(layer);
  const colors = ['#5ec8f0','#7c8bf5','#f0b95e','#f0708c','#c47cf5','#5ef0a8'];
  for(let i=0;i<50;i++){
    const c = document.createElement('div');
    c.className='confetti';
    c.style.left = Math.random()*100+'vw';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDuration = (2.4+Math.random()*1.6)+'s';
    c.style.animationDelay = (Math.random()*0.6)+'s';
    layer.appendChild(c);
  }
  setTimeout(()=> layer.remove(), 4500);
}

/* boot */
render();
</script>
</body>
</html>
