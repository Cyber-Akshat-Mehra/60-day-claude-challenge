<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Think Like a Marketing Strategist: Grow This Brand</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --bg:#0B0E14;
    --panel:#12161F;
    --panel-2:#161B26;
    --line:#232A38;
    --text:#E7EAF0;
    --muted:#8993A6;
    --accent:#6FE3C4;
    --accent-2:#F2B155;
    --accent-3:#7C9EFF;
    --danger:#F1707A;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 90% -10%, rgba(124,158,255,0.10), transparent 60%),
      radial-gradient(1000px 500px at 0% 110%, rgba(111,227,196,0.08), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height:100vh;
  }
  @font-face{font-family:'Sora-fallback';src:local('Arial');}
  h1,h2,h3,.display{
    font-family: 'Sora', 'Space Grotesk', -apple-system, sans-serif;
    letter-spacing:-0.02em;
  }
  #root{min-height:100vh; display:flex; flex-direction:column;}
  .app-shell{
    max-width:980px;
    margin:0 auto;
    width:100%;
    padding: 28px 20px 80px;
    flex:1;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 6px 4px 22px;
    border-bottom:1px solid var(--line);
    margin-bottom:26px;
  }
  .brandmark{
    display:flex;align-items:center;gap:10px;
    font-weight:700;font-size:15px;color:var(--text);
  }
  .brandmark .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 12px var(--accent);
  }
  .rail{
    display:flex; gap:6px; flex-wrap:wrap;
  }
  .rail-step{
    font-size:11px;
    padding:5px 10px;
    border-radius:999px;
    border:1px solid var(--line);
    color:var(--muted);
    background:var(--panel);
    white-space:nowrap;
  }
  .rail-step.active{
    color:#0B0E14;
    background:var(--accent);
    border-color:var(--accent);
    font-weight:700;
  }
  .rail-step.done{
    color:var(--accent);
    border-color:rgba(111,227,196,0.4);
  }
  .card{
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:26px;
    margin-bottom:20px;
    animation: rise .45s ease both;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  .eyebrow{
    text-transform:uppercase;
    font-size:11px;
    letter-spacing:0.12em;
    color:var(--accent-3);
    font-weight:700;
    margin-bottom:10px;
  }
  h1.hero{
    font-size:clamp(28px,4.5vw,42px);
    line-height:1.08;
    margin:0 0 14px;
  }
  h2.section-title{
    font-size:clamp(20px,3vw,26px);
    margin:0 0 8px;
  }
  p.lead{
    color:var(--muted);
    font-size:15.5px;
    line-height:1.65;
    margin:0 0 18px;
  }
  .explain-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin:18px 0;
  }
  @media (max-width:640px){ .explain-grid{grid-template-columns:1fr;} }
  .explain-box{
    background:rgba(255,255,255,0.02);
    border:1px solid var(--line);
    border-left:3px solid var(--accent-3);
    border-radius:10px;
    padding:14px 16px;
  }
  .explain-box.why{border-left-color:var(--accent-2);}
  .explain-box .tag{
    font-size:11px;font-weight:700;text-transform:uppercase;
    letter-spacing:0.08em;color:var(--accent-3);margin-bottom:6px;
  }
  .explain-box.why .tag{color:var(--accent-2);}
  .explain-box p{margin:0;font-size:14px;color:var(--text);line-height:1.55;}

  .choice-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:14px;
    margin-top:18px;
  }
  .choice-card{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px;
    cursor:pointer;
    transition: all .18s ease;
    text-align:left;
  }
  .choice-card:hover{
    border-color:var(--accent);
    transform:translateY(-3px);
    box-shadow:0 10px 28px rgba(0,0,0,0.35);
  }
  .choice-card .icon{font-size:26px;margin-bottom:10px; display:block;}
  .choice-card h3{margin:0 0 6px;font-size:16px;}
  .choice-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.5;}

  button.btn{
    font-family:inherit;
    font-weight:700;
    font-size:14px;
    border-radius:10px;
    padding:12px 22px;
    border:1px solid transparent;
    cursor:pointer;
    transition:all .15s ease;
  }
  .btn-primary{
    background:var(--accent);
    color:#06110D;
  }
  .btn-primary:hover{filter:brightness(1.08); transform:translateY(-1px);}
  .btn-primary:disabled{
    background:var(--panel-2);
    color:var(--muted);
    cursor:not-allowed;
    border:1px solid var(--line);
  }
  .btn-secondary{
    background:transparent;
    border:1px solid var(--line);
    color:var(--text);
  }
  .btn-secondary:hover{border-color:var(--accent-3); color:var(--accent-3);}
  .btn-row{display:flex; gap:12px; margin-top:22px; flex-wrap:wrap; align-items:center;}

  .pill{
    display:inline-block;
    font-size:11.5px;
    padding:4px 10px;
    border-radius:999px;
    background:rgba(111,227,196,0.1);
    color:var(--accent);
    border:1px solid rgba(111,227,196,0.25);
    margin-right:6px;
    margin-bottom:6px;
    font-weight:600;
  }

  .biz-summary{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:12px;
    margin:18px 0;
  }
  .biz-field{
    background:rgba(255,255,255,0.02);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
  }
  .biz-field .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
  .biz-field .v{font-size:14px;font-weight:600;}

  .platform-card{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:12px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .platform-card.selected{
    border-color:var(--accent);
    background:rgba(111,227,196,0.06);
  }
  .platform-card .prow{display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .platform-card .pname{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;}
  .fit-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;}
  .fit-high{background:rgba(111,227,196,0.15);color:var(--accent);}
  .fit-med{background:rgba(242,177,85,0.15);color:var(--accent-2);}
  .fit-low{background:rgba(241,112,122,0.15);color:var(--danger);}
  .platform-card .why{color:var(--muted);font-size:13.5px;margin-top:8px;line-height:1.5;}
  .checkbox-indicator{
    width:20px;height:20px;border-radius:5px;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .checkbox-indicator.on{background:var(--accent); border-color:var(--accent); color:#06110D; font-weight:900;}

  .pillar-card{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:12px;
    cursor:pointer;
    transition:all .15s ease;
    position:relative;
  }
  .pillar-card.selected{border-color:var(--accent-2); background:rgba(242,177,85,0.06);}
  .pillar-card.disabled{opacity:.4; cursor:not-allowed;}
  .pillar-card h4{margin:0 0 6px;font-size:15px;}
  .pillar-card p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.5;}
  .pillar-num{
    position:absolute; top:14px; right:16px;
    width:24px;height:24px;border-radius:50%;
    background:var(--accent-2); color:#1B1200;
    font-size:12px;font-weight:800;
    display:flex;align-items:center;justify-content:center;
  }

  .week-card{
    display:flex; gap:16px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:12px;
  }
  .week-num{
    font-family:'Sora', sans-serif;
    font-size:22px; font-weight:800;
    color:var(--accent-3);
    min-width:56px;
  }
  .week-num small{display:block; font-size:10px; color:var(--muted); font-weight:600; margin-top:2px;}
  .week-body h4{margin:0 0 6px; font-size:15px;}
  .week-body p{margin:0; color:var(--muted); font-size:13.5px; line-height:1.55;}

  .claude-card{
    background:linear-gradient(135deg, rgba(124,158,255,0.08), rgba(111,227,196,0.05));
    border:1px dashed rgba(124,158,255,0.35);
    border-radius:12px;
    padding:16px 18px;
    margin-top:18px;
  }
  .claude-card .ctitle{
    font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.07em;
    color:var(--accent-3); margin-bottom:10px; display:flex; align-items:center; gap:6px;
  }
  .claude-prompt{
    background:#080A10;
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px 14px;
    font-family: 'SF Mono', 'Consolas', monospace;
    font-size:12.5px;
    color:#C9E8FF;
    line-height:1.6;
    white-space:pre-wrap;
    position:relative;
  }
  .copy-btn{
    margin-top:10px;
    font-size:12px;
    padding:6px 12px;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--muted);
    cursor:pointer;
  }
  .copy-btn:hover{color:var(--accent-3); border-color:var(--accent-3);}

  .event-banner{
    background: linear-gradient(135deg, rgba(241,112,122,0.12), rgba(242,177,85,0.08));
    border:1px solid rgba(241,112,122,0.3);
    border-radius:12px;
    padding:18px;
    margin-bottom:18px;
  }
  .event-banner .etitle{font-weight:800; color:var(--danger); font-size:13px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px;}

  .response-option{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:12px;
    cursor:pointer;
  }
  .response-option:hover{border-color:var(--accent-3);}
  .response-option.chosen{border-color:var(--accent-3); background:rgba(124,158,255,0.07);}
  .consequence-box{
    margin-top:16px;
    background:rgba(111,227,196,0.06);
    border:1px solid rgba(111,227,196,0.25);
    border-radius:10px;
    padding:14px 16px;
    font-size:14px;
    line-height:1.6;
  }

  .report-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  @media (max-width:640px){ .report-grid{grid-template-columns:1fr;} }
  .report-block{
    background:rgba(255,255,255,0.02);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 18px;
  }
  .report-block h4{
    margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--accent);
  }
  .report-block p{margin:0; font-size:14px; color:var(--text); line-height:1.6;}
  .lesson-item{
    display:flex; gap:12px; align-items:flex-start;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .lesson-item:last-child{border-bottom:none;}
  .lesson-num{
    font-family:'Sora',sans-serif; font-weight:800; color:var(--accent-2); font-size:15px;
    min-width:24px;
  }
  .score-hero{
    text-align:center;
    padding:20px 0 8px;
  }
  .score-hero .num{
    font-family:'Sora', sans-serif;
    font-size:56px; font-weight:800;
    background:linear-gradient(135deg, var(--accent), var(--accent-3));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .score-hero .label{color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:.08em; margin-top:4px;}

  .footer-note{
    text-align:center; color:var(--muted); font-size:12px; margin-top:40px; opacity:.7;
  }
  ::selection{background:var(--accent); color:#06110D;}
  a{color:var(--accent-3);}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useCallback } = React;

/* ---------- DATA ---------- */

const INDUSTRIES = [
  { industry: "Cold-brew coffee subscription", audience: "Busy urban professionals, 25-40, value convenience and quality", budget: "$3,000/month", competitors: "Local roasteries, Blue Bottle, big-box grocery brands", challenge: "Customers churn after 2 months because they forget to reorder" },
  { industry: "Handmade ceramic homeware", audience: "Design-conscious renters, 22-35, active on Pinterest & Instagram", budget: "$800/month", competitors: "Etsy sellers, West Elm, local pottery studios", challenge: "Beautiful product but almost no one outside friends & family knows it exists" },
  { industry: "Kids' coding bootcamp", audience: "Parents of children 8-14 who worry about too much screen time", budget: "$5,000/month", competitors: "Code Ninjas, local library programs, YouTube tutorials", challenge: "Parents don't understand what the class actually teaches" },
  { industry: "Sustainable sneaker brand", audience: "Gen Z & young millennials who care about ethics but still want style", budget: "$12,000/month", competitors: "Allbirds, Veja, fast-fashion sneaker brands", challenge: "Seen as 'worthy but boring' — struggles to look cool" },
  { industry: "Boutique fitness studio (Pilates)", audience: "Women 28-45 in a mid-size city, health-focused, time-poor", budget: "$2,000/month", competitors: "Big-box gyms, other boutique studios, home workout apps", challenge: "Great retention once people try it, but first-time trial bookings are low" },
  { industry: "B2B invoicing software for freelancers", audience: "Freelancers and solo consultants who hate admin work", budget: "$7,000/month", competitors: "QuickBooks, Wave, FreshBooks", challenge: "Free competitors make it hard to justify a paid plan" },
  { industry: "Plant-based meal prep delivery", audience: "Health-conscious young professionals, 24-38, short on cooking time", budget: "$4,500/month", competitors: "HelloFresh, local meal prep companies, grocery ready-meals", challenge: "High interest but customers think it's more expensive than it is" },
  { industry: "Local independent bookstore", audience: "Readers of all ages in the neighborhood, community-minded", budget: "$500/month", competitors: "Amazon, Barnes & Noble, BookTok-famous online shops", challenge: "Foot traffic dropping as more people buy online" },
];

const PLATFORM_LIBRARY = {
  instagram: { name: "Instagram", emoji:"📸", strength: v => v.visual, base: "Best for visually rich, lifestyle-driven brands. Strong for building an aesthetic and community through Reels & Stories." },
  tiktok: { name: "TikTok", emoji:"🎵", strength: v => v.youthAudience && v.visual, base: "Best when the audience skews younger and the content can be fast, authentic, and entertaining rather than polished." },
  linkedin: { name: "LinkedIn", emoji:"💼", strength: v => v.b2b || v.personal, base: "Best for B2B products, professional services, and personal brands built on expertise or career story." },
  x: { name: "X / Twitter", emoji:"🐦", strength: v => v.b2b || v.personal, base: "Best for real-time commentary, thought leadership, and joining industry conversations quickly." },
  facebook: { name: "Facebook", emoji:"👍", strength: v => v.olderAudience || v.local, base: "Best for reaching an older or local audience, running community groups, and local-event promotion." },
  pinterest: { name: "Pinterest", emoji:"📌", strength: v => v.visual && !v.b2b, base: "Best for product discovery through search-like browsing — strong for home goods, fashion, food, and DIY." },
  youtube: { name: "YouTube", emoji:"▶️", strength: v => v.education || v.personal, base: "Best for depth: tutorials, explainers, behind-the-scenes, and long-term SEO value. Requires more production effort." },
  newsletter: { name: "Email Newsletter", emoji:"✉️", strength: v => v.personal || v.retention, base: "Best for owned-audience relationships that don't depend on an algorithm — great for retention and trust-building." },
};

const PILLAR_LIBRARY_BUSINESS = [
  { key:"education", title:"Audience Education", desc:"Teach your audience something useful related to your product. Builds trust and positions you as the expert, not just a seller." },
  { key:"social_proof", title:"Social Proof", desc:"Reviews, testimonials, and customer stories. Reduces risk in a buyer's mind — 'if it worked for them, it'll work for me.'" },
  { key:"behind_scenes", title:"Behind the Scenes", desc:"Show how the product is made or the team behind it. Builds emotional connection and humanizes the brand." },
  { key:"product_value", title:"Product in Action", desc:"Direct demonstrations of the product solving a real problem. Drives consideration and conversion." },
  { key:"community", title:"Community & Culture", desc:"Content about your values, causes, or the community around your brand. Builds loyalty beyond the transaction." },
  { key:"trends", title:"Trend Participation", desc:"Timely, culturally relevant content. Boosts reach and discoverability, but has short shelf life." },
  { key:"offers", title:"Promotions & Offers", desc:"Direct calls to purchase. Drives short-term revenue but shouldn't dominate the content mix." },
];

const PILLAR_LIBRARY_PERSONAL = [
  { key:"thought_leadership", title:"Thought Leadership", desc:"Sharing your opinions and frameworks on topics in your field. Builds authority and attracts opportunities." },
  { key:"personal_story", title:"Personal Story", desc:"Your journey, struggles, and turning points. Builds emotional connection — people follow people, not resumes." },
  { key:"behind_scenes", title:"Behind the Scenes", desc:"How you actually work day-to-day. Makes you feel real and relatable, not a polished persona." },
  { key:"audience_education", title:"Audience Education", desc:"Teaching what you know in digestible pieces. Proves expertise and gives followers a reason to keep coming back." },
  { key:"community", title:"Community Engagement", desc:"Replying, resharing, and amplifying others in your space. Builds relationships and algorithmic reach." },
  { key:"trends", title:"Trend Participation", desc:"Commenting on what's happening now in your industry. Keeps you visible and part of current conversations." },
  { key:"offers", title:"Offers & Calls to Action", desc:"Inviting people to work with you, buy your thing, or join your list. Necessary, but shouldn't be the majority of posts." },
];

const EVENTS_BUSINESS = [
  { title: "A competitor just went viral mocking your industry", detail: "A rival brand posted a cheeky video that's getting huge engagement — some of it references your niche directly.", options: [
      { label: "Join the conversation with your own witty take", consequence: "Short-term reach spike, but risks looking reactive if it doesn't fit your brand voice. Worked because you engaged fast." },
      { label: "Ignore it and stay focused on your own content plan", consequence: "Safe and consistent, but you miss a moment of extra visibility. Consistency compounds over time regardless." },
      { label: "Reach out to the competitor for a collab response", consequence: "Unexpected but can build goodwill and double the reach if they agree — though it depends entirely on their willingness." },
  ]},
  { title: "One of your posts unexpectedly went viral", detail: "A behind-the-scenes video got 40x your normal views overnight. Comments are flooding in and a few press accounts noticed.", options: [
      { label: "Post a fast follow-up while attention is high", consequence: "Capitalizes on the momentum — attention is a limited window and striking while it's hot usually pays off." },
      { label: "Pause and make sure customer service can handle the influx", consequence: "Protects the customer experience, which matters more long-term than a single viral moment." },
      { label: "Run paid ads to retarget everyone who engaged", consequence: "Can convert curiosity into customers efficiently, but only works if your landing experience is ready." },
  ]},
  { title: "A negative review is spreading in a local Facebook group", detail: "A customer had a bad experience and it's getting shared with sympathetic comments piling on.", options: [
      { label: "Respond publicly, calmly, and offer to make it right", consequence: "Shows transparency — most onlookers judge you by how you handle the problem, not that it happened." },
      { label: "Reach out privately and stay quiet publicly", consequence: "Solves it for that customer, but onlookers see silence, which can read as avoidance." },
      { label: "Do nothing and hope it blows over", consequence: "Risky — unaddressed complaints tend to resurface and erode trust over time." },
  ]},
  { title: "Your budget just got cut in half unexpectedly", detail: "Leadership needs to reallocate spend elsewhere this month. You have to make hard choices about where to focus.", options: [
      { label: "Concentrate all spend on your single best-performing channel", consequence: "Efficient in the short term, but leaves you dependent on one channel if it underperforms." },
      { label: "Spread thin across all channels to maintain presence everywhere", consequence: "Keeps a foothold everywhere, but rarely enough budget in any one place to actually move results." },
      { label: "Pause paid spend entirely and lean into organic content", consequence: "Forces creativity and can build stronger long-term assets, though growth will likely slow in the short term." },
  ]},
];

const EVENTS_PERSONAL = [
  { title: "One of your posts went viral overnight", detail: "A post you didn't expect much from is suddenly everywhere. Your follower count is climbing fast and strangers are commenting.", options: [
      { label: "Post a thoughtful follow-up while attention is high", consequence: "Smart — viral moments are a window, and a strong follow-up converts curiosity into real followers." },
      { label: "Reply personally to as many comments as possible", consequence: "Builds real connection with new followers, though it's time-intensive and doesn't scale forever." },
      { label: "Stay quiet and let it run its course", consequence: "Low-risk, but you leave engagement — and potential new relationships — on the table." },
  ]},
  { title: "A podcast host just invited you on their show", detail: "A respected podcast in your niche wants to interview you next month.", options: [
      { label: "Say yes and prepare a clear point of view to share", consequence: "Great exposure — arriving with a strong POV (not just answers) is what makes guest appearances memorable." },
      { label: "Say yes but wing it without much prep", consequence: "Still valuable exposure, but you risk sounding generic instead of establishing a distinct voice." },
      { label: "Decline — you don't feel ready yet", consequence: "Understandable, but opportunities like this don't always repeat — waiting for 'ready' can cost momentum." },
  ]},
  { title: "Someone is closely copying your content", detail: "You've noticed another creator posting ideas and phrasing that closely mirror your recent work.", options: [
      { label: "Call it out publicly", consequence: "Can feel validating and draws attention to you as the original source, but risks looking petty if handled poorly." },
      { label: "Ignore it and keep creating at your own pace", consequence: "Protects your energy — consistent originality is hard to fake long-term, which naturally outpaces copycats." },
      { label: "Message them privately and address it directly", consequence: "Often the most mature path — sometimes it resolves the issue quietly and sometimes it doesn't." },
  ]},
  { title: "You had a public disagreement with someone in your industry", detail: "A comment-thread debate turned into a visible back-and-forth that others are now watching.", options: [
      { label: "Write a calm, thoughtful post clarifying your actual position", consequence: "Reinforces your POV to a now-larger audience — disagreements often become the moment people first notice you." },
      { label: "Let it drop and move on to other content", consequence: "Avoids escalation, though you leave your position unclear to anyone who saw the disagreement." },
      { label: "Double down and keep arguing your point", consequence: "Can look passionate to supporters, but risks defining your brand by the conflict rather than your ideas." },
  ]},
];

/* ---------- HELPERS ---------- */

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function buildVisualProfile(mode, biz){
  // crude heuristic profile used to score platform fit
  if(mode === "personal"){
    return { visual:false, youthAudience:false, b2b:true, olderAudience:false, local:false, education:true, personal:true, retention:true };
  }
  const text = (biz.industry + " " + biz.audience).toLowerCase();
  return {
    visual: /coffee|ceramic|sneaker|fitness|meal|bookstore|homeware/.test(text),
    youthAudience: /gen z|22-35|24-38|8-14/.test(text) || /sneaker|coding/.test(text),
    b2b: /software|invoicing|b2b/.test(text),
    olderAudience: /45|local|neighborhood/.test(text),
    local: /local|neighborhood|studio|city/.test(text),
    education: /coding|software|coffee/.test(text),
    personal: false,
    retention: /subscription|software|meal prep/.test(text),
  };
}

function scorePlatforms(mode, biz){
  const v = buildVisualProfile(mode, biz);
  return Object.entries(PLATFORM_LIBRARY).map(([key, p])=>{
    const fit = p.strength(v);
    let level = fit ? "high" : (Math.random() > 0.5 ? "med" : "low");
    return { key, ...p, level, reason: p.base };
  }).sort((a,b)=> (a.level==="high"?0:a.level==="med"?1:2) - (b.level==="high"?0:b.level==="med"?1:2));
}

function ClaudeCard({ title, prompt }){
  const [copied, setCopied] = useState(false);
  const doCopy = () => {
    const ta = document.createElement("textarea");
    ta.value = prompt;
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
    setCopied(true);
    setTimeout(()=>setCopied(false), 1600);
  };
  return (
    <div className="claude-card">
      <div className="ctitle">💬 How to ask Claude — {title}</div>
      <div className="claude-prompt">{prompt}</div>
      <button className="copy-btn" onClick={doCopy}>{copied ? "Copied ✓" : "Copy prompt"}</button>
    </div>
  );
}

function ProgressRail({ steps, current }){
  return (
    <div className="rail">
      {steps.map((s, i) => (
        <div key={s} className={"rail-step " + (i===current ? "active" : i<current ? "done":"")}>

      ))}
    </div>
  );
}

function generateReport(mode, biz, platforms, pillars, roadmap, event, response){
  const platNames = platforms.map(p=>p.name).join(", ");
  const pillarNames = pillars.map(p=>p.title).join(", ");
  const score = Math.min(98, 62 + platforms.length*5 + pillars.length*3 + Math.floor(Math.random()*10));

  const lessonsPersonal = [
    "Authenticity beats polish — people follow specific perspectives, not generic advice.",
    "Consistency compounds — showing up reliably matters more than any single viral post.",
    "Niche clarity attracts the right people — trying to appeal to everyone attracts no one.",
  ];
  const lessonsBusiness = [
    "Strategy comes before content — knowing who you're talking to shapes everything else.",
    "Trust is built in sequence — audiences move from aware to interested to loyal, not instantly to 'buy.'",
    "Fewer platforms done well beats many platforms done poorly.",
  ];

  return {
    audience: mode === "personal"
      ? `${biz.name}'s audience is drawn to a clear point of view on ${biz.industry}. They follow for perspective and expertise, not just updates.`
      : `The audience for this ${biz.industry} brand (${biz.audience}) responds best to content that speaks directly to their situation rather than generic promotion.`,
    platform: `Focusing on ${platNames} matches where this audience already spends time and how they prefer to consume content — depth over spread.`,
    content: `Anchoring around ${pillarNames} gives the content a clear purpose each time it's posted, instead of posting reactively.`,
    growth: score >= 85
      ? "Strong growth potential — the strategy is focused and the platform choices are well matched to the audience."
      : "Solid growth potential, with room to sharpen platform focus or content consistency over time.",
    bestDecision: `Choosing to prioritize ${platforms[0]?.name || "a core platform"} and lead with "${pillars[0]?.title}" content gave the strategy a clear entry point.`,
    biggestMistake: response
      ? `The response to "${event.title}" ("${response.label}") carried real trade-offs — every choice under pressure has a cost, and this one was no exception.`
      : "Not yet tested under pressure.",
    lessons: mode === "personal" ? lessonsPersonal : lessonsBusiness,
    score,
  };
}

function ReportStep({ mode, biz, platforms, pillars, roadmap, event, response, onRestart }){
  const report = useMemo(()=>generateReport(mode, biz, platforms, pillars, roadmap, event, response), []);
  return (
    <div className="card">
      <div className="eyebrow">Final — Growth Report</div>
      <div className="score-hero">
        <div className="num">{report.score}</div>
        <div className="label">Strategic Growth Score</div>
      </div>
      <h2 className="section-title" style={{textAlign:"center"}}>
        {mode === "personal" ? `${biz.name}'s Brand Report` : "Your Brand's Growth Report"}
      </h2>
      <div className="report-grid" style={{marginTop:"18px"}}>
        <div className="report-block"><h4>Audience Understanding</h4><p>{report.audience}</p></div>
        <div className="report-block"><h4>Platform Strategy</h4><p>{report.platform}</p></div>
        <div className="report-block"><h4>Content Strategy</h4><p>{report.content}</p></div>
        <div className="report-block"><h4>Growth Potential</h4><p>{report.growth}</p></div>
        <div className="report-block"><h4>Best Decision</h4><p>{report.bestDecision}</p></div>
        <div className="report-block"><h4>Biggest Mistake (or Risk)</h4><p>{report.biggestMistake}</p></div>
      </div>
      <div className="report-block" style={{marginTop:"14px"}}>
        <h4>Three Marketing Lessons</h4>
        {report.lessons.map((l, i) => (
          <div className="lesson-item" key={i}>
            <div className="lesson-num">{String(i+1).padStart(2,"0")}</div>
            <p style={{margin:0, fontSize:"14px", lineHeight:1.6}}>{l}</p>
          </div>
        ))}
      </div>
      <ClaudeCard
        title="Turning this into a real plan"
        prompt={mode==="personal"
          ? `I just mapped out a strategy for my personal brand around ${biz.industry}.\nHelp me turn this into a real 30-day content calendar with specific post\nideas for these pillars: ${pillars.map(p=>p.title).join(", ")}.`
          : `I just mapped out a marketing strategy for my ${biz.industry} business.\nHelp me turn this into a real 30-day content calendar with specific post\nideas for these pillars: ${pillars.map(p=>p.title).join(", ")}.`}
      />
      <div className="btn-row">
        <button className="btn btn-primary" onClick={onRestart}>🔁 Play again with a new brand</button>
      </div>
    </div>
  );
}

/* ---------- APP ROOT ---------- */

function App(){
  const [stage, setStage] = useState("welcome");
  const [mode, setMode] = useState(null);
  const [biz, setBiz] = useState(null);
  const [platforms, setPlatforms] = useState([]);
  const [pillars, setPillars] = useState([]);
  const [roadmap, setRoadmap] = useState([]);
  const [event, setEvent] = useState(null);
  const [response, setResponse] = useState(null);

  const stepsLabels = ["Brand", "Understand", "Platforms", "Pillars", "Roadmap", "Event", "Report"];
  const stageIndex = {
    welcome:-1, mode:0, ownform:0, personalform:0,
    understand:1, platform:2, pillar:3, roadmap:4, event:5, report:6
  }[stage];

  const restart = () => {
    setStage("mode"); setMode(null); setBiz(null); setPlatforms([]);
    setPillars([]); setRoadmap([]); setEvent(null); setResponse(null);
  };

  const handleModePick = (m) => {
    setMode(m);
    if(m === "own") setStage("ownform");
    else if(m === "personal") setStage("personalform");
    else {
      setBiz(pick(INDUSTRIES));
      setStage("understand");
    }
  };

  return (
    <div className="app-shell">
      <div className="topbar">
        <div className="brandmark"><span className="dot"></span> Marketing Strategist Sim</div>
        {stage !== "welcome" && <ProgressRail steps={stepsLabels} current={stageIndex}/>}
      </div>

      {stage === "welcome" && <Welcome onStart={()=>setStage("mode")} />}
      {stage === "mode" && <ModeSelect onPick={handleModePick} />}
      {stage === "ownform" && <OwnBusinessForm onSubmit={(b)=>{ setBiz(b); setStage("understand"); }} />}
      {stage === "personalform" && <PersonalBrandForm onSubmit={(b)=>{ setBiz(b); setStage("understand"); }} />}
      {stage === "understand" && biz && (
        <BusinessUnderstanding mode={mode} biz={biz} onNext={()=>setStage("platform")} />
      )}
      {stage === "platform" && biz && (
        <PlatformStep mode={mode} biz={biz} onNext={(p)=>{ setPlatforms(p); setStage("pillar"); }} />
      )}
      {stage === "pillar" && biz && (
        <PillarStep mode={mode} biz={biz} onNext={(p)=>{ setPillars(p); setStage("roadmap"); }} />
      )}
      {stage === "roadmap" && biz && (
        <RoadmapStep mode={mode} pillars={pillars} onNext={()=>setStage("event")} />
      )}
      {stage === "event" && biz && (
        <EventStep mode={mode} onNext={(ev, resp)=>{ setEvent(ev); setResponse(resp); setStage("report"); }} />
      )}
      {stage === "report" && biz && (
        <ReportStep mode={mode} biz={biz} platforms={platforms} pillars={pillars} roadmap={roadmap} event={event} response={response} onRestart={restart} />
      )}

      <div className="footer-note">Think Like a Marketing Strategist — an offline learning simulator. No data leaves your browser.</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
