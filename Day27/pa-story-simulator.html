<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prior Authorization Story Simulator</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* Small custom touches Tailwind utility classes can't express cleanly */
  body{ font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .bubble-in{ animation: riseIn .35s ease both; }
  @keyframes riseIn{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }
  #chat-feed{ scroll-behavior:smooth; }
  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:#94c9c2; border-radius:8px; }
</style>
</head>
<body class="bg-teal-50 min-h-screen text-slate-800">

<!-- ============================================================
     STICKY HEADER: title + 8-scene progress bar
     ============================================================ -->
<header class="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-teal-100 shadow-sm">
  <div class="max-w-3xl mx-auto px-4 py-3">
    <div class="flex items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🩺</span>
        <div>
          <h1 class="text-base sm:text-lg font-bold text-teal-900 leading-tight">Prior Authorization Story Simulator</h1>
          <p class="text-[11px] sm:text-xs text-slate-500 leading-tight">A beginner-friendly walkthrough of how Prior Authorization really works</p>
        </div>
      </div>
      <button id="btn-restart" class="text-xs sm:text-sm font-semibold bg-teal-600 hover:bg-teal-700 text-white px-3 py-2 rounded-lg shadow-sm transition">↺ Restart</button>
    </div>
    <!-- Progress bar -->
    <div class="mt-3">
      <div class="flex justify-between text-[10px] sm:text-[11px] font-semibold text-teal-800 mb-1" id="scene-label">
        <span>Scene 1 of 8</span>
        <span id="scene-title-tag">Doctor Visit</span>
      </div>
      <div class="w-full h-2 bg-teal-100 rounded-full overflow-hidden">
        <div id="progress-fill" class="h-full bg-gradient-to-r from-teal-400 to-teal-600 rounded-full transition-all duration-500" style="width:12.5%"></div>
      </div>
    </div>
  </div>
</header>

<!-- ============================================================
     MAIN CHAT FEED (append-only — createElement/appendChild only)
     ============================================================ -->
<main class="max-w-3xl mx-auto px-4 py-6">
  <div id="chat-feed" class="flex flex-col gap-3"></div>

  <!-- Choices render here, replaced each turn (this container's own
       children are managed via appendChild/removeChild — the chat
       feed above is never touched with innerHTML) -->
  <div id="choice-zone" class="mt-5"></div>
</main>

<footer class="max-w-3xl mx-auto px-4 pb-10 pt-2 text-center text-[11px] text-slate-400">
  Educational simulation. "StarCare Health" is a fictional, illustrative payer used for teaching purposes only.
</footer>

<script>
/* ================================================================
   PRIOR AUTHORIZATION STORY SIMULATOR
   Single-file HTML + Tailwind (CDN) + vanilla JS.
   RULE: the #chat-feed container is only ever modified with
   createElement + appendChild. innerHTML is never assigned on it.
   ================================================================ */

/* ----------------------------------------------------------------
   CHARACTER CONFIG
   ---------------------------------------------------------------- */
const CHAR = {
  rahul: { name:"Rahul", avatar:"👦", side:"left",
    bubble:"bg-white border border-sky-200 text-slate-800",
    nameColor:"text-sky-700" },
  priya: { name:"Priya", avatar:"👧", side:"right",
    bubble:"bg-teal-600 text-white",
    nameColor:"text-teal-50" }
};

/* ----------------------------------------------------------------
   STORY DATA — 8 scenes. Each scene is a list of "beats".
   Beat types:
     narrator  -> centered italic text (scene-setting)
     doctor    -> centered italic text, prefixed with doctor name
     say       -> chat bubble from rahul or priya
     panel     -> a highlighted info panel (flow diagram / list / stat)
   Each scene also has `choices`: two options, each with a label and
   a `reply` beat list that is appended before moving on, plus an
   optional `flag` stored for later personalization.
   ---------------------------------------------------------------- */
const SCENES = [

  /* ---------------- 1. DOCTOR VISIT ---------------- */
  {
    title:"Doctor Visit",
    beats:[
      {type:"narrator", text:"City Medical Center — Tuesday morning."},
      {type:"doctor", name:"Dr. Patel", text:"Based on your joint pain, swelling, and your bloodwork, this looks like Rheumatoid Arthritis. I'd like to start you on a medication called Humira."},
      {type:"say", who:"rahul", text:"Okay... is that something I can just pick up at the pharmacy today?"},
      {type:"doctor", name:"Dr. Patel", text:"Not quite — Humira is a specialty medication, so your insurance will need to review the request first. My office will handle that part."}
    ],
    choices:[
      { label:"Ask Dr. Patel a few more questions", flag:"curious",
        reply:[{type:"say", who:"rahul", text:"What exactly does the insurance need to check before I can start?"},
               {type:"doctor", name:"Dr. Patel", text:"Good question — my care coordinator, Priya, will walk you through it. It's called Prior Authorization."}]},
      { label:"Just get the prescription and go", flag:"rushed",
        reply:[{type:"say", who:"rahul", text:"Sure, whatever gets me feeling better fastest."},
               {type:"narrator", text:"Rahul heads home, unaware of the process that's about to start behind the scenes."}]}
    ]
  },

  /* ---------------- 2. INSURANCE ROADBLOCK ---------------- */
  {
    title:"Insurance Roadblock",
    beats:[
      {type:"narrator", text:"Later that day, at Dr. Patel's office."},
      {type:"say", who:"priya", text:"Hi Rahul, I'm Priya — I handle healthcare operations here. Dr. Patel's office is submitting a Prior Authorization (PA) request directly to your insurance plan, StarCare Health*."},
      {type:"panel", flow:["Provider (Dr. Patel's Office)","PA Request","Payer (StarCare Health*)"],
        note:"Notice: no pharmacy is involved at this stage — the request goes straight from the provider to the payer."},
      {type:"say", who:"priya", text:"One more thing worth knowing: once a PA is approved, it's saved on file — StarCare Health keeps a permanent record of that approval tied to your case."},
      {type:"say", who:"rahul", text:"So this happens before I even go to the pharmacy?"},
      {type:"say", who:"priya", text:"Exactly. We want everything cleared with your plan first, so there are no surprises when you go to fill it."}
    ],
    choices:[
      { label:"\"Why does the pharmacy skip this step?\"", flag:"asked-pharmacy",
        reply:[{type:"say", who:"rahul", text:"Why does the pharmacy skip this step?"},
               {type:"say", who:"priya", text:"For medications like Humira that are given through a doctor's office or a specialty pharmacy, the clinical review happens between the provider and the payer — the retail pharmacy isn't part of that conversation."}]},
      { label:"\"What happens once it's approved?\"", flag:"asked-approval",
        reply:[{type:"say", who:"rahul", text:"What happens once it's approved?"},
               {type:"say", who:"priya", text:"You'll get a reference number, and StarCare Health keeps that approval on file — that record matters later, so hold onto it."}]}
    ]
  },

  /* ---------------- 3. WHAT IS PA? ---------------- */
  {
    title:"What is PA?",
    beats:[
      {type:"say", who:"rahul", text:"Can you explain what Prior Authorization actually is? In plain English?"},
      {type:"say", who:"priya", text:"Sure. Prior Authorization is a check your insurance plan runs before agreeing to pay for certain medications or procedures — basically, 'is this the right treatment, at the right time, for this diagnosis?'"},
      {type:"say", who:"priya", text:"You might also hear about 'step therapy' — where a plan wants you to try a lower-cost option first. It's not just red tape: for aggressive diagnoses like Rheumatoid Arthritis, delays from step therapy can genuinely affect how the disease progresses."},
      {type:"panel", stat:true,
        note:"AMA 2023 PA Survey: Prior Authorization causes treatment delays in the majority of cases."},
      {type:"say", who:"priya", text:"That's exactly why getting the paperwork right the first time matters so much — it's not just about approval, it's about not losing time."}
    ],
    choices:[
      { label:"\"Is step therapy always required?\"", flag:"asked-step",
        reply:[{type:"say", who:"rahul", text:"Is step therapy always required?"},
               {type:"say", who:"priya", text:"Not always — it depends on the plan and diagnosis. Sometimes documentation of severity can support skipping straight to a stronger medication."}]},
      { label:"\"How long does PA usually take?\"", flag:"asked-time",
        reply:[{type:"say", who:"rahul", text:"How long does PA usually take?"},
               {type:"say", who:"priya", text:"It varies by payer and how complete the submission is — which is exactly what we're about to prepare carefully."}]}
    ]
  },

  /* ---------------- 4. INSURANCE REVIEW ---------------- */
  {
    title:"Insurance Review",
    beats:[
      {type:"say", who:"priya", text:"Let's look at what StarCare Health actually checks when a PA request lands on their desk."},
      {type:"panel", checklist:[
          {label:"Eligibility", detail:"Confirms you're actively covered on the plan date of service — no coverage, no review."},
          {label:"Clinical documentation", detail:"Chart notes, labs, and exam findings that support the diagnosis and treatment need."},
          {label:"ICD-10 diagnosis match", detail:"The billing diagnosis code must match what's clinically documented — mismatches are a common reason for delay."},
          {label:"Step therapy history", detail:"Evidence of prior treatments tried (or a clinical reason to skip them)."}
        ]},
      {type:"say", who:"priya", text:"Each of these exists to protect something: eligibility protects the plan's accuracy, documentation protects patient safety, the ICD-10 match protects against coding errors, and step therapy history protects against unnecessary cost — but as we saw, it can also cost time."}
    ],
    choices:[
      { label:"\"What if one of these is missing?\"", flag:"asked-missing",
        reply:[{type:"say", who:"rahul", text:"What if one of these is missing?"},
               {type:"say", who:"priya", text:"Then the payer can't fully approve it yet — that's actually what happens next in your case."}]},
      { label:"\"Sounds thorough — let's see what they find.\"", flag:"neutral",
        reply:[{type:"say", who:"rahul", text:"Sounds thorough. Let's see what they find."},
               {type:"narrator", text:"A few business days pass while StarCare Health reviews the submission."}]}
    ]
  },

  /* ---------------- 5. DENIAL ---------------- */
  {
    title:"Denial",
    beats:[
      {type:"narrator", text:"An update arrives from StarCare Health."},
      {type:"panel", denial:true, note:"Status: DENIED — reason: missing step therapy documentation."},
      {type:"say", who:"rahul", text:"Denied?! Does that mean I can't get the medication at all?"},
      {type:"say", who:"priya", text:"Take a breath — a denial isn't permanent. It means the file was incomplete, not that the answer is final. We can fix this."},
      {type:"say", who:"priya", text:"On our side, there's a real system cost too: PA denials typically cost physician offices 2+ staff hours to resolve — tracking down records, resubmitting, following up. That's part of why getting it right the first time matters so much."}
    ],
    choices:[
      { label:"\"What do we do now?\"", flag:"asked-next",
        reply:[{type:"say", who:"rahul", text:"What do we do now?"},
               {type:"say", who:"priya", text:"We appeal — with the missing documentation added in. Let's get started."}]},
      { label:"\"This feels really discouraging.\"", flag:"discouraged",
        reply:[{type:"say", who:"rahul", text:"Honestly, this feels really discouraging."},
               {type:"say", who:"priya", text:"That's a completely normal reaction. Denials are frustrating, but most step-therapy denials like yours are resolved on appeal once the record is complete."}]}
    ]
  },

  /* ---------------- 6. APPEAL ---------------- */
  {
    title:"Appeal",
    beats:[
      {type:"say", who:"priya", text:"Here's how we build a strong appeal, step by step."},
      {type:"panel", checklist:[
          {label:"Gather documentation", detail:"Pull records of any prior treatments tried, plus current labs and exam notes."},
          {label:"Letter of Medical Necessity", detail:"Dr. Patel writes a letter explaining, clinically, why Humira is necessary for you specifically."},
          {label:"Formal appeal filing", detail:"The completed packet — documentation plus the letter — is filed with StarCare Health as a formal appeal."}
        ]},
      {type:"say", who:"rahul", text:"So this is basically resubmitting, but with everything they said was missing?"},
      {type:"say", who:"priya", text:"Exactly. A well-documented appeal has a strong chance of turning a denial around."}
    ],
    choices:[
      { label:"\"Can I help with anything?\"", flag:"helped",
        reply:[{type:"say", who:"rahul", text:"Is there anything I can do to help?"},
               {type:"say", who:"priya", text:"If you remember trying any past medications or physical therapy for your joints, tell me now — that history strengthens the letter."}]},
      { label:"\"I'll let you and Dr. Patel handle it.\"", flag:"handsoff",
        reply:[{type:"say", who:"rahul", text:"I'll trust you and Dr. Patel to handle the details."},
               {type:"say", who:"priya", text:"Sounds good — we'll keep you updated as soon as we hear back."}]}
    ]
  },

  /* ---------------- 7. APPROVAL ---------------- */
  {
    title:"Approval",
    beats:[
      {type:"narrator", text:"A few days later..."},
      {type:"panel", approval:true, note:"Status: APPROVED — Reference #: SC-HUM-48213"},
      {type:"say", who:"priya", text:"Great news, Rahul — the appeal was approved! This approval is now saved on file with StarCare Health under that reference number."},
      {type:"say", who:"rahul", text:"Does that mean I have to go through all of this again next time?"},
      {type:"say", who:"priya", text:"No repeat PA needed for Humira going forward — the approval on file covers your ongoing treatment, as long as your plan and prescription stay the same."}
    ],
    choices:[
      { label:"\"What if something changes later?\"", flag:"asked-change",
        reply:[{type:"say", who:"rahul", text:"What if something changes later — like my dose, or my plan?"},
               {type:"say", who:"priya", text:"If your dosage, medication, or insurance plan changes, a new PA may be required — but for now, you're all set."}]},
      { label:"\"Thank you for walking me through this.\"", flag:"grateful",
        reply:[{type:"say", who:"rahul", text:"Thank you for walking me through all of this — it makes a lot more sense now."},
               {type:"say", who:"priya", text:"That's exactly why I'm here. Let's recap what we both learned."}]}
    ]
  },

  /* ---------------- 8. TAKEAWAYS ---------------- */
  {
    title:"Takeaways",
    beats:[
      {type:"narrator", text:"Looking back on the journey — two perspectives on the same process."},
      {type:"panel", takeaways:true},
      {type:"say", who:"priya", text:"Every PA that comes across my desk becomes part of a bigger picture — how we improve the process for the next patient."},
      {type:"say", who:"rahul", text:"And for me, it's good to finally understand why this all happens — it wasn't just red tape, it was a real review."}
    ],
    choices:[
      { label:"Replay the story", flag:"replay", restart:true,
        reply:[{type:"narrator", text:"Restarting Rahul's story from the beginning..."}]},
      { label:"End here", flag:"end",
        reply:[{type:"narrator", text:"— The End —"}]}
    ]
  }
];

/* ----------------------------------------------------------------
   STATE
   ---------------------------------------------------------------- */
let sceneIndex = 0;
const flagsCollected = [];

/* ----------------------------------------------------------------
   DOM REFERENCES
   ---------------------------------------------------------------- */
const feed = document.getElementById("chat-feed");
const choiceZone = document.getElementById("choice-zone");
const progressFill = document.getElementById("progress-fill");
const sceneLabel = document.getElementById("scene-label").querySelector("span");
const sceneTitleTag = document.getElementById("scene-title-tag");

/* ----------------------------------------------------------------
   RENDER HELPERS — every new node uses createElement + appendChild.
   The chat feed's innerHTML is NEVER assigned directly.
   ---------------------------------------------------------------- */
function appendNarrator(text){
  const wrap = document.createElement("div");
  wrap.className = "bubble-in text-center italic text-slate-500 text-sm px-6 py-1";
  wrap.textContent = text;
  feed.appendChild(wrap);
}

function appendDoctor(name, text){
  const wrap = document.createElement("div");
  wrap.className = "bubble-in text-center italic text-slate-600 text-sm px-6 py-1";
  const strong = document.createElement("span");
  strong.className = "font-semibold not-italic text-slate-700";
  strong.textContent = name + ": ";
  wrap.appendChild(strong);
  const span = document.createElement("span");
  span.textContent = "\u201c" + text + "\u201d";
  wrap.appendChild(span);
  feed.appendChild(wrap);
}

function appendSay(who, text){
  const c = CHAR[who];
  const row = document.createElement("div");
  row.className = "bubble-in flex items-end gap-2 " + (c.side === "right" ? "flex-row-reverse" : "flex-row");

  const avatar = document.createElement("div");
  avatar.className = "text-2xl leading-none shrink-0";
  avatar.textContent = c.avatar;
  row.appendChild(avatar);

  const col = document.createElement("div");
  col.className = "max-w-[75%] flex flex-col " + (c.side === "right" ? "items-end" : "items-start");

  const nameEl = document.createElement("div");
  nameEl.className = "text-[11px] font-semibold mb-0.5 " + (c.side === "right" ? "text-teal-700" : "text-sky-700");
  nameEl.textContent = c.name;
  col.appendChild(nameEl);

  const bubble = document.createElement("div");
  bubble.className = c.bubble + " rounded-2xl px-4 py-2 text-sm shadow-sm " +
    (c.side === "right" ? "rounded-tr-sm" : "rounded-tl-sm");
  bubble.textContent = text;
  col.appendChild(bubble);

  row.appendChild(col);
  feed.appendChild(row);
}

function appendPanel(beat){
  const card = document.createElement("div");
  card.className = "bubble-in bg-white border border-teal-200 rounded-xl shadow-sm p-4 my-1";

  if(beat.flow){
    const flowWrap = document.createElement("div");
    flowWrap.className = "flex flex-wrap items-center justify-center gap-2 text-xs sm:text-sm font-semibold text-teal-800";
    beat.flow.forEach((step, i)=>{
      const chip = document.createElement("span");
      chip.className = "bg-teal-50 border border-teal-200 rounded-full px-3 py-1";
      chip.textContent = step;
      flowWrap.appendChild(chip);
      if(i < beat.flow.length - 1){
        const arrow = document.createElement("span");
        arrow.className = "text-teal-400";
        arrow.textContent = "→";
        flowWrap.appendChild(arrow);
      }
    });
    card.appendChild(flowWrap);
  }

  if(beat.checklist){
    const list = document.createElement("ul");
    list.className = "flex flex-col gap-2";
    beat.checklist.forEach(item=>{
      const li = document.createElement("li");
      li.className = "flex gap-2 text-sm";
      const bullet = document.createElement("span");
      bullet.className = "text-teal-500 mt-0.5";
      bullet.textContent = "✓";
      li.appendChild(bullet);
      const textWrap = document.createElement("div");
      const strong = document.createElement("span");
      strong.className = "font-semibold text-slate-800";
      strong.textContent = item.label + ": ";
      const detail = document.createElement("span");
      detail.className = "text-slate-600";
      detail.textContent = item.detail;
      textWrap.appendChild(strong);
      textWrap.appendChild(detail);
      li.appendChild(textWrap);
      list.appendChild(li);
    });
    card.appendChild(list);
  }

  if(beat.stat){
    card.className += " bg-teal-50 border-teal-300";
    const icon = document.createElement("div");
    icon.className = "text-xs font-bold text-teal-700 uppercase tracking-wide mb-1";
    icon.textContent = "📊 Cited Data Point";
    card.appendChild(icon);
    const p = document.createElement("p");
    p.className = "text-sm text-slate-700 italic";
    p.textContent = beat.note;
    card.appendChild(p);
    return feed.appendChild(card);
  }

  if(beat.denial){
    card.className = "bubble-in bg-rose-50 border border-rose-300 rounded-xl shadow-sm p-4 my-1 text-center";
    const badge = document.createElement("div");
    badge.className = "inline-block bg-rose-600 text-white text-xs font-bold px-3 py-1 rounded-full mb-2";
    badge.textContent = "PA STATUS UPDATE";
    card.appendChild(badge);
    const p = document.createElement("p");
    p.className = "text-sm font-semibold text-rose-700";
    p.textContent = beat.note;
    card.appendChild(p);
    return feed.appendChild(card);
  }

  if(beat.approval){
    card.className = "bubble-in bg-emerald-50 border border-emerald-300 rounded-xl shadow-sm p-4 my-1 text-center";
    const badge = document.createElement("div");
    badge.className = "inline-block bg-emerald-600 text-white text-xs font-bold px-3 py-1 rounded-full mb-2";
    badge.textContent = "PA STATUS UPDATE";
    card.appendChild(badge);
    const p = document.createElement("p");
    p.className = "text-sm font-semibold text-emerald-700";
    p.textContent = beat.note;
    card.appendChild(p);
    return feed.appendChild(card);
  }

  if(beat.takeaways){
    card.className = "bubble-in bg-white border border-teal-200 rounded-xl shadow-sm p-4 my-1";
    const grid = document.createElement("div");
    grid.className = "grid sm:grid-cols-2 gap-4";

    const patientCol = document.createElement("div");
    patientCol.className = "bg-sky-50 border border-sky-200 rounded-lg p-3";
    const pTitle = document.createElement("div");
    pTitle.className = "text-xs font-bold text-sky-700 uppercase tracking-wide mb-2";
    pTitle.textContent = "👦 Patient Perspective";
    patientCol.appendChild(pTitle);
    [
      "PA is a review step insurers use before covering certain treatments.",
      "A denial isn't the end — most are resolved through a complete appeal.",
      "Once approved, the record stays on file — no need to repeat it for the same treatment."
    ].forEach(t=>{
      const li = document.createElement("p");
      li.className = "text-sm text-slate-700 mb-1";
      li.textContent = "• " + t;
      patientCol.appendChild(li);
    });
    grid.appendChild(patientCol);

    const systemCol = document.createElement("div");
    systemCol.className = "bg-teal-50 border border-teal-200 rounded-lg p-3";
    const sTitle = document.createElement("div");
    sTitle.className = "text-xs font-bold text-teal-700 uppercase tracking-wide mb-2";
    sTitle.textContent = "👧 System Perspective";
    systemCol.appendChild(sTitle);
    [
      "Health systems track denial rate to see how often submissions are incomplete.",
      "Appeal rate shows how often a denial gets successfully reversed with more documentation.",
      "Resolution time reflects how many extra staff hours a case like this ultimately costs."
    ].forEach(t=>{
      const li = document.createElement("p");
      li.className = "text-sm text-slate-700 mb-1";
      li.textContent = "• " + t;
      systemCol.appendChild(li);
    });
    grid.appendChild(systemCol);

    card.appendChild(grid);
    return feed.appendChild(card);
  }

  feed.appendChild(card);
}

/* Renders a single beat object using the right helper */
function renderBeat(beat){
  if(beat.type === "narrator") appendNarrator(beat.text);
  else if(beat.type === "doctor") appendDoctor(beat.name, beat.text);
  else if(beat.type === "say") appendSay(beat.who, beat.text);
  else if(beat.type === "panel") appendPanel(beat);
  feed.scrollIntoView({behavior:"smooth", block:"end"});
  window.scrollTo({top:document.body.scrollHeight, behavior:"smooth"});
}

/* ----------------------------------------------------------------
   SCENE / CHOICE FLOW
   ---------------------------------------------------------------- */
function updateProgress(){
  const pct = ((sceneIndex+1)/SCENES.length)*100;
  progressFill.style.width = pct + "%";
  sceneLabel.textContent = "Scene " + (sceneIndex+1) + " of " + SCENES.length;
  sceneTitleTag.textContent = SCENES[sceneIndex].title;
}

function playScene(){
  updateProgress();
  const scene = SCENES[sceneIndex];

  // Small scene-title divider inside the feed for readability
  const divider = document.createElement("div");
  divider.className = "bubble-in mt-4 mb-1 flex items-center gap-3";
  const line1 = document.createElement("div");
  line1.className = "flex-1 h-px bg-teal-200";
  const label = document.createElement("div");
  label.className = "text-[11px] font-bold text-teal-600 uppercase tracking-widest";
  label.textContent = "Scene " + (sceneIndex+1) + " · " + scene.title;
  const line2 = document.createElement("div");
  line2.className = "flex-1 h-px bg-teal-200";
  divider.appendChild(line1);
  divider.appendChild(label);
  divider.appendChild(line2);
  feed.appendChild(divider);

  scene.beats.forEach(renderBeat);
  renderChoices(scene);
}

function renderChoices(scene){
  // Clear only the choice zone (never the chat feed)
  while(choiceZone.firstChild) choiceZone.removeChild(choiceZone.firstChild);

  const wrap = document.createElement("div");
  wrap.className = "bubble-in flex flex-col sm:flex-row gap-3 justify-center";

  scene.choices.forEach(choice=>{
    const btn = document.createElement("button");
    btn.className = "flex-1 bg-white border-2 border-teal-300 hover:border-teal-500 hover:bg-teal-50 text-teal-800 font-semibold text-sm rounded-xl px-4 py-3 shadow-sm transition text-left";
    btn.textContent = choice.label;
    btn.addEventListener("click", ()=> handleChoice(scene, choice));
    wrap.appendChild(btn);
  });

  choiceZone.appendChild(wrap);
}

function handleChoice(scene, choice){
  // Lock in the choice: clear choice buttons so it can't be clicked twice
  while(choiceZone.firstChild) choiceZone.removeChild(choiceZone.firstChild);

  if(choice.flag) flagsCollected.push(choice.flag);
  if(choice.reply) choice.reply.forEach(renderBeat);

  const continueBtn = document.createElement("button");
  continueBtn.className = "bubble-in mt-3 mx-auto block bg-teal-600 hover:bg-teal-700 text-white font-semibold text-sm rounded-full px-6 py-2 shadow-sm transition";
  continueBtn.textContent = (sceneIndex === SCENES.length - 1)
    ? (choice.restart ? "Restart Story ↺" : "Finished ✓")
    : "Continue →";
  continueBtn.addEventListener("click", ()=>{
    while(choiceZone.firstChild) choiceZone.removeChild(choiceZone.firstChild);
    if(sceneIndex === SCENES.length - 1){
      if(choice.restart){ restartStory(); }
      else { continueBtn.remove(); }
      return;
    }
    sceneIndex++;
    playScene();
  });
  choiceZone.appendChild(continueBtn);
  if(sceneIndex === SCENES.length - 1 && !choice.restart){
    // Nothing further to click for "End here" — just leave the closing beat visible.
  }
}

function restartStory(){
  sceneIndex = 0;
  flagsCollected.length = 0;
  while(feed.firstChild) feed.removeChild(feed.firstChild);
  while(choiceZone.firstChild) choiceZone.removeChild(choiceZone.firstChild);
  window.scrollTo({top:0, behavior:"smooth"});
  playScene();
}

/* ----------------------------------------------------------------
   BOOT
   ---------------------------------------------------------------- */
document.getElementById("btn-restart").addEventListener("click", restartStory);
playScene();

</script>
</body>
